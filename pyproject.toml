[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hipengine"
version = "0.0.0"
description = "ROCm-native local LLM inference engine with a torch-free runtime hot path"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "hipEngine contributors" }
]
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
torch = [
  "torch>=2.5",
]
dev = [
  "pytest>=8.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
hipengine-server = "hipengine.server.__main__:main"

[tool.hatch.build]
artifacts = [
  "hipengine/kernels/hip_gfx1100/attention/aotriton_runtime/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["hipengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
